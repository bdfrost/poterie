{{define "partials/svg-pot"}}
<svg viewBox="0 0 400 400" class="fst-svg" xmlns="http://www.w3.org/2000/svg">
    <!-- Top-down pot: just a circle outline -->
    <circle cx="200" cy="200" r="180" class="fst-pot-rim" fill="none" stroke-width="4"/>
    <!-- Inner rim -->
    <circle cx="200" cy="200" r="170" class="fst-pot-inner" fill="none" stroke-width="1" />
    <!-- Soil fill - light -->
    <circle cx="200" cy="200" r="168" class="fst-pot-soil" fill-opacity="0.04"/>

    <!-- Thriller (center, largest) -->
    {{if .Rec.Thriller}}
    <circle cx="200" cy="190" r="55" class="fst-plant-lg"/>
    <text x="200" y="185" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{.Rec.Thriller.Name}}</text>
    <text x="200" y="205" text-anchor="middle" class="fst-sublabel" dominant-baseline="middle">thriller</text>
    {{end}}

    <!-- Fillers surround thriller on sides and back -->
    {{range $i, $filler := .Rec.Fillers}}
    {{$cx := 130}}{{$cy := 160}}
    {{if eq $i 1}}{{$cx = 270}}{{else if eq $i 2}}{{$cx = 200}}{{$cy = 100}}{{end}}
    <circle cx="{{$cx}}" cy="{{$cy}}" r="35" class="fst-plant-circle"/>
    <text x="{{$cx}}" y="{{$cy}}" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{$filler.Name}}</text>
    {{end}}

    <!-- Spillers hang over front edge (bottom of pot) -->
    <g>
        {{range $i, $spiller := .Rec.Spillers}}
        {{$sx := 140}}{{$sy := 290}}
        {{if eq $i 1}}{{$sx = 260}}{{end}}
        <!-- Cascade path hangs outside rim, going down toward viewer -->
        <path d="M{{$sx}},{{add $sy 28}} C{{$sx}},{{add $sy 50}} {{add $sx 12}},{{add $sy 65}} {{add $sx 8}},{{add $sy 80}}" class="fst-cascade" stroke-width="2" stroke-linecap="round"/>
        <path d="M{{add $sx 15}},{{add $sy 25}} C{{add $sx 20}},{{add $sy 45}} {{add $sx 30}},{{add $sy 55}} {{add $sx 22}},{{add $sy 70}}" class="fst-cascade" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="{{$sx}}" cy="{{$sy}}" r="28" class="fst-plant-circle"/>
        <text x="{{$sx}}" y="{{$sy}}" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{$spiller.Name}}</text>
        {{end}}
    </g>

    <!-- Legend -->
    <rect x="280" y="340" width="90" height="55" rx="6" class="fst-legend-bg"/>
    <circle cx="295" cy="355" r="5" class="fst-legend-thriller"/>
    <text x="305" y="358" class="fst-legend-label">Thriller</text>
    <circle cx="295" cy="370" r="5" class="fst-legend-filler"/>
    <text x="305" y="373" class="fst-legend-label">Filler</text>
    <circle cx="295" cy="385" r="5" class="fst-legend-spiller"/>
    <text x="305" y="388" class="fst-legend-label">Spiller</text>
</svg>
{{end}}

{{define "partials/svg-bed"}}
<svg viewBox="0 0 600 400" class="fst-svg" xmlns="http://www.w3.org/2000/svg">
    <!-- Bed outline - top-down rounded rectangle -->
    <rect x="25" y="25" width="550" height="350" rx="20" class="fst-bed-rim" fill="none" stroke-width="3"/>
    <rect x="30" y="30" width="540" height="340" rx="16" class="fst-bed-soil" fill-opacity="0.03"/>

    <!-- Subtle grid -->
    <g class="fst-grid" stroke-width="0.5" opacity="0.2">
        <line x1="150" y1="30" x2="150" y2="365"/>
        <line x1="275" y1="30" x2="275" y2="365"/>
        <line x1="400" y1="30" x2="400" y2="365"/>
        <line x1="525" y1="30" x2="525" y2="365"/>
        <line x1="30" y1="140" x2="565" y2="140"/>
        <line x1="30" y1="250" x2="565" y2="250"/>
    </g>

    <!-- Back center: Thriller -->
    {{if .Rec.Thriller}}
    <circle cx="300" cy="100" r="55" class="fst-plant-lg"/>
    <text x="300" y="95" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{.Rec.Thriller.Name}}</text>
    <text x="300" y="115" text-anchor="middle" class="fst-sublabel" dominant-baseline="middle">thriller</text>
    {{end}}

    <!-- Fillers on sides of thriller -->
    {{range $i, $filler := .Rec.Fillers}}
    {{$cx := 180}}{{$cy := 200}}
    {{if eq $i 1}}{{$cx = 420}}{{else if eq $i 2}}{{$cx = 300}}{{$cy = 150}}{{end}}
    <circle cx="{{$cx}}" cy="{{$cy}}" r="35" class="fst-plant-circle"/>
    <text x="{{$cx}}" y="{{$cy}}" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{$filler.Name}}</text>
    {{end}}

    <!-- Spillers at front edge, cascading down toward viewer -->
    {{range $i, $spiller := .Rec.Spillers}}
    {{$sx := 230}}{{$sy := 295}}
    {{if eq $i 1}}{{$sx = 370}}{{end}}
    <circle cx="{{$sx}}" cy="{{$sy}}" r="28" class="fst-plant-circle"/>
    <text x="{{$sx}}" y="{{$sy}}" text-anchor="middle" class="fst-label" dominant-baseline="middle">{{$spiller.Name}}</text>
    <!-- Cascades hang outside bed rim, going down -->
    <path d="M{{$sx}},{{add $sy 28}} C{{$sx}},{{add $sy 45}} {{add $sx 10}},{{add $sy 60}} {{add $sx 6}},{{add $sy 72}}" class="fst-cascade" stroke-width="2" stroke-linecap="round"/>
    <path d="M{{add $sx 12}},{{add $sy 25}} C{{add $sx 18}},{{add $sy 42}} {{add $sx 28}},{{add $sy 52}} {{add $sx 18}},{{add $sy 64}}" class="fst-cascade" stroke-width="1.2" stroke-linecap="round"/>
    {{end}}

    <!-- Legend -->
    <rect x="450" y="340" width="80" height="55" rx="6" class="fst-legend-bg"/>
    <circle cx="465" cy="355" r="5" class="fst-legend-thriller"/>
    <text x="475" y="358" class="fst-legend-label">Thriller</text>
    <circle cx="465" cy="370" r="5" class="fst-legend-filler"/>
    <text x="475" y="373" class="fst-legend-label">Filler</text>
    <circle cx="465" cy="385" r="5" class="fst-legend-spiller"/>
    <text x="475" y="388" class="fst-legend-label">Spiller</text>

    <!-- Bed label -->
    <text x="300" y="385" text-anchor="middle" class="fst-bed-label">Garden Bed — Top View</text>
</svg>
{{end}}
