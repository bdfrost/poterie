{{define "partials/svg-pot"}}
<svg viewBox="0 0 400 400" class="fst-svg" xmlns="http://www.w3.org/2000/svg">
    <!-- Top-down pot: just a circle outline -->
    <circle cx="200" cy="200" r="180" class="fst-pot-rim" fill="none" stroke-width="4"/>
    <!-- Inner rim -->
    <circle cx="200" cy="200" r="170" class="fst-pot-inner" fill="none" stroke-width="1" />
    <!-- Soil fill - light -->
    <circle cx="200" cy="200" r="168" class="fst-pot-soil" fill-opacity="0.04"/>

    <!-- Thriller (center, focal — only plant that keeps a halo) -->
    {{if .Rec.Thriller}}
    <g transform="translate(200,178)" class="fst-plant fst-plant-thriller">
        <circle r="52" class="fst-plant-lg"/>
        <g transform="translate(-24,-24)" class="fst-glyph" style="color: {{.Rec.Thriller.ColorHex}}">
            {{template "partials/glyph-thriller" dict "Hex" .Rec.Thriller.ColorHex "Class" ""}}
        </g>
        <text y="30" text-anchor="middle" class="fst-label">{{.Rec.Thriller.Name}}</text>
        <text y="42" text-anchor="middle" class="fst-sublabel">thriller</text>
    </g>
    {{end}}

    <!-- Fillers surround the thriller: one glyph per plant (a duplicated
         species still draws each instance — the diagram shows the real
         arrangement). Triangle: left, right, back-center. -->
    {{range $i, $f := .Rec.Fillers}}
    {{$cx := 122}}{{$cy := 176}}
    {{if eq $i 1}}{{$cx = 278}}{{else if eq $i 2}}{{$cx = 200}}{{$cy = 90}}{{end}}
    <g transform="translate({{$cx}},{{$cy}})" class="fst-plant fst-plant-filler">
        <g transform="translate(-17.3,-17.3) scale(0.72)" class="fst-glyph" style="color: {{$f.ColorHex}}">
            {{template "partials/glyph-filler" dict "Hex" $f.ColorHex "Class" ""}}
        </g>
        <text y="24" text-anchor="middle" class="fst-label fst-label-sm">{{$f.Name}}</text>
    </g>
    {{end}}

    <!-- Spillers hang over front edge (bottom of pot), spread wide so their
         cascades don't fight each other -->
    {{range $i, $s := .Rec.Spillers}}
    {{$sx := 110}}{{$sy := 302}}
    {{if eq $i 1}}{{$sx = 290}}{{end}}
    <!-- Cascade path hangs outside rim, going down toward viewer -->
    <path d="M{{$sx}},{{add $sy 26}} C{{$sx}},{{add $sy 48}} {{add $sx 12}},{{add $sy 62}} {{add $sx 8}},{{add $sy 76}}" class="fst-cascade" stroke-width="2" stroke-linecap="round"/>
    <path d="M{{add $sx 15}},{{add $sy 23}} C{{add $sx 20}},{{add $sy 43}} {{add $sx 30}},{{add $sy 53}} {{add $sx 22}},{{add $sy 66}}" class="fst-cascade" stroke-width="1.2" stroke-linecap="round"/>
    <g transform="translate({{$sx}},{{$sy}})" class="fst-plant fst-plant-spiller">
        <g transform="translate(-14.9,-14.9) scale(0.62)" class="fst-glyph" style="color: {{$s.ColorHex}}">
            {{template "partials/glyph-spiller" dict "Hex" $s.ColorHex "Class" ""}}
        </g>
        <text y="21" text-anchor="middle" class="fst-label fst-label-sm">{{$s.Name}}</text>
    </g>
    {{end}}
</svg>
{{end}}

{{define "partials/svg-bed"}}
<svg viewBox="0 0 600 400" class="fst-svg" xmlns="http://www.w3.org/2000/svg">
    <!-- Bed outline - top-down rounded rectangle -->
    <rect x="25" y="25" width="550" height="350" rx="20" class="fst-bed-rim" fill="none" stroke-width="3"/>
    <rect x="30" y="30" width="540" height="340" rx="16" class="fst-bed-soil" fill-opacity="0.03"/>

    <!-- Subtle grid -->
    <g class="fst-grid" stroke-width="0.5" opacity="0.2">
        <line x1="150" y1="30" x2="150" y2="365"/>
        <line x1="275" y1="30" x2="275" y2="365"/>
        <line x1="400" y1="30" x2="400" y2="365"/>
        <line x1="525" y1="30" x2="525" y2="365"/>
        <line x1="30" y1="140" x2="565" y2="140"/>
        <line x1="30" y1="250" x2="565" y2="250"/>
    </g>

    <!-- Back center: Thriller (focal — only plant that keeps a halo) -->
    {{if .Rec.Thriller}}
    <g transform="translate(300,98)" class="fst-plant fst-plant-thriller">
        <circle r="52" class="fst-plant-lg"/>
        <g transform="translate(-24,-24)" class="fst-glyph" style="color: {{.Rec.Thriller.ColorHex}}">
            {{template "partials/glyph-thriller" dict "Hex" .Rec.Thriller.ColorHex "Class" ""}}
        </g>
        <text y="30" text-anchor="middle" class="fst-label">{{.Rec.Thriller.Name}}</text>
        <text y="42" text-anchor="middle" class="fst-sublabel">thriller</text>
    </g>
    {{end}}

    <!-- Fillers flank the thriller: one glyph per plant (duplicated species
         still draw each instance). Left, right, center-front. -->
    {{range $i, $f := .Rec.Fillers}}
    {{$cx := 172}}{{$cy := 205}}
    {{if eq $i 1}}{{$cx = 428}}{{else if eq $i 2}}{{$cx = 300}}{{$cy = 165}}{{end}}
    <g transform="translate({{$cx}},{{$cy}})" class="fst-plant fst-plant-filler">
        <g transform="translate(-17.3,-17.3) scale(0.72)" class="fst-glyph" style="color: {{$f.ColorHex}}">
            {{template "partials/glyph-filler" dict "Hex" $f.ColorHex "Class" ""}}
        </g>
        <text y="24" text-anchor="middle" class="fst-label fst-label-sm">{{$f.Name}}</text>
    </g>
    {{end}}

    <!-- Spillers at front edge, cascading down toward viewer -->
    {{range $i, $s := .Rec.Spillers}}
    {{$sx := 218}}{{$sy := 302}}
    {{if eq $i 1}}{{$sx = 382}}{{end}}
    <g transform="translate({{$sx}},{{$sy}})" class="fst-plant fst-plant-spiller">
        <g transform="translate(-14.9,-14.9) scale(0.62)" class="fst-glyph" style="color: {{$s.ColorHex}}">
            {{template "partials/glyph-spiller" dict "Hex" $s.ColorHex "Class" ""}}
        </g>
        <text y="21" text-anchor="middle" class="fst-label fst-label-sm">{{$s.Name}}</text>
    </g>
    <!-- Cascades hang outside bed rim, going down -->
    <path d="M{{$sx}},{{add $sy 26}} C{{$sx}},{{add $sy 43}} {{add $sx 10}},{{add $sy 58}} {{add $sx 6}},{{add $sy 70}}" class="fst-cascade" stroke-width="2" stroke-linecap="round"/>
    <path d="M{{add $sx 12}},{{add $sy 23}} C{{add $sx 18}},{{add $sy 40}} {{add $sx 28}},{{add $sy 50}} {{add $sx 18}},{{add $sy 62}}" class="fst-cascade" stroke-width="1.2" stroke-linecap="round"/>
    {{end}}

    <!-- Bed label -->
    <text x="300" y="385" text-anchor="middle" class="fst-bed-label">Garden Bed — Top View</text>
</svg>
{{end}}

{{/* Legend rendered as HTML below the SVG (no longer inside the viewBox,
     where it fought the second spiller's cascade for space) */}}
{{define "partials/svg-legend"}}
<div class="flex justify-center gap-5 mt-2 text-sm bot-text-secondary">
    <span class="inline-flex items-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: var(--border-thriller)"></span>Thriller
    </span>
    <span class="inline-flex items-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: var(--border-filler)"></span>Filler
    </span>
    <span class="inline-flex items-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full" style="background-color: var(--border-spiller)"></span>Spiller
    </span>
</div>
{{end}}
