apiVersion: v1
kind: Service
metadata:
  name: {{ include "poterie.fullname" . }}
  labels:
    {{- include "poterie.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "poterie.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
