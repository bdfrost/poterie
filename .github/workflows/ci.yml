name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsqlite3-dev

      - name: Download deps
        run: go mod download

      - name: Run tests
        run: go test ./... -v -coverprofile=cover.out -count=1

      - name: Check coverage
        run: |
          COVER=$(go test ./... -cover | grep -v "no test files" | grep -v "coverage: 0.0%" | awk -F': ' '{print $2}' | sed 's/% of statements//' | awk '{sum+=$1; n++} END {printf "%.1f", sum/n}')
          echo "Average coverage: $COVER%"
          # Require at least 50% average coverage (core packages are 80%+)
          python3 -c "exit(0 if $COVER >= 50 else 1)"

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: false
          cache-key: "staticcheck"

  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: poterie:smoke
          build-args: |
            VERSION=smoke-test

      - name: Run container
        run: |
          docker run -d --name poterie-smoke -p 8080:8080 poterie:smoke
          sleep 3

      - name: Health check
        run: curl -sf http://localhost:8080/api/health

      - name: FST endpoint smoke test
        run: |
          # Zone 5, full sun, loam, container — should return 6 plants
          body=$(curl -sf -X POST http://localhost:8080/api/fst \
            -d "zone=5&sun=full_sun&soil=loam&layout=container")

          # Count fst-plant- entries (each plant in the SVG layout)
          count=$(echo "$body" | grep -o 'fst-plant-' | wc -l)
          echo "Plants returned: $count"
          [ "$count" -ge 3 ] || { echo "FAIL: expected >= 3 plants, got $count"; exit 1; }

      - name: Planner page renders
        run: |
          code=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/planner)
          [ "$code" = "200" ] || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f poterie-smoke

  build-and-push:
    needs: [test, smoke-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  release:
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
