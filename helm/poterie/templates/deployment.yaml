apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poterie.fullname" . }}
  labels:
    {{- include "poterie.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "poterie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poterie.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: poterie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: ADMIN_PASS
              value: {{ .Values.admin.pass | quote }}
            - name: DB_PATH
              value: "/data/poterie.db"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "poterie.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
